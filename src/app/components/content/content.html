<main class="contentMain padding">
  <div class="contentText">
    <h1 class="textFont">{{ content }}</h1>
    <p>نتشرف بتواصلكم معنا :</p>
  </div>

  <div class="selectorPLace">
    <span [class.spanActive]="selectedOption === '1'" (click)="selectOption('1')"
      >فرع دار البيضاء</span
    >
    <span [class.spanActive]="selectedOption === '2'" (click)="selectOption('2')">فرع النسيم</span>
  </div>

  @if (selectedOption === '1') {
    <div class="contactContainer">
      <div class="mapBox">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3628.75!2d46.8015801!3d24.5676498!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e2f090049603a87%3A0xbe6ece08dc7df033!2s%D9%85%D8%B9%D8%B5%D9%88%D8%A8%20%D8%B9%D8%B1%D9%8A%D9%83%D8%A9%20%D8%A7%D9%84%D8%B9%D9%85%D8%AF%D8%A9!5e0!3m2!1sar!2ssa!4v1!5m2!1sar!2ssa"
          width="100%"
          height="100%"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        >
        </iframe>
      </div>
      <div class="social">
        <div class="phone">
          <h1>Call Number: <span>+966 538181612</span></h1>
          <fa-icon [icon]="phone"></fa-icon>
        </div>
        <div class="email">
          <h1>Support: <span>ekasa123@gmail.com</span></h1>
          <fa-icon [icon]="email"></fa-icon>
        </div>
        <div class="road">
          <h1>Location: <span>دار البيضاء</span></h1>
          <fa-icon [icon]="road"></fa-icon>
        </div>
      </div>
    </div>
  } @else if (selectedOption === '2') {
    <div class="contactContainer">
      <div class="mapBox">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d36123.208465717864!2d46.86556392403933!3d24.739074069632867!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e2faa3d59f9cf8d%3A0x48a47dd71ebfc54d!2z2KfZhNmG2LPZitmFINin2YTYtNix2YLZitiMINin2YTYsdmK2KfYtg!5e1!3m2!1sar!2ssa!4v1790068389179!5m2!1sar!2ssa"
          width="100%"
          height="100%"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        >
        </iframe>
      </div>
      <div class="social">
        <div class="phone">
          <h1>Call Number: <span>+966 </span></h1>
          <fa-icon [icon]="phone"></fa-icon>
        </div>
        <div class="email">
          <h1>Support: <span>ekasa123@gmail.com</span></h1>
          <fa-icon [icon]="email"></fa-icon>
        </div>
        <div class="road">
          <h1>Location: <span>النسيم</span></h1>
          <fa-icon [icon]="road"></fa-icon>
        </div>
      </div>
    </div>
  }
</main>
